name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      SUPABASE_SECRET_KEY: placeholder-secret-key
      GROQ_API_KEY: placeholder-groq-api-key
      GROQ_MODEL: openai/gpt-oss-20b
      QDRANT_URL: https://placeholder.qdrant.io:6333
      QDRANT_API_KEY: placeholder-qdrant-api-key
      HF_TOKEN: placeholder-hf-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v